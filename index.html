<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POL — The Open Money Stack</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#f5f5f2;
  color:#111;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:92%;
  max-width:1320px;
  margin:auto;
}

/* HEADER */

header{
  height:76px;
  border-bottom:1px solid #d8d8d5;
  display:flex;
  align-items:center;
  background:#f5f5f2;
}

.header-inner{
  width:92%;
  max-width:1320px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo-icon{
  width:29px;
  height:29px;
  background:#8247e5;
  transform:rotate(30deg);
  border-radius:5px;
  position:relative;
}

.logo-icon:before{
  content:"";
  position:absolute;
  width:14px;
  height:5px;
  background:white;
  left:7px;
  top:12px;
  transform:rotate(-30deg);
  border-radius:5px;
}

nav{
  display:flex;
  gap:32px;
  font-size:13px;
  font-weight:600;
}

nav a:hover{
  opacity:.5;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:14px;
}

.circle{
  width:35px;
  height:35px;
  border:1px solid #bbb;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

.get-started{
  background:#111;
  color:white;
  padding:12px 19px;
  border-radius:30px;
  font-size:12px;
  font-weight:700;
}

/* HERO */

.hero{
  min-height:720px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.hero:after{
  content:"";
  position:absolute;
  width:650px;
  height:650px;
  right:-220px;
  top:40px;
  background:radial-gradient(
    circle,
    #c8a8ff 0%,
    #e1d4ff 25%,
    transparent 68%
  );
  opacity:.85;
}

.hero-content{
  position:relative;
  z-index:2;
  padding:110px 0;
}

.eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:32px;
}

.hero h1{
  font-size:clamp(70px,11vw,155px);
  line-height:.83;
  letter-spacing:-9
