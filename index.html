<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POL — The Open Money Stack</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f7f7f5;
  color: #111;
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

.container {
  width: min(1240px, 92%);
  margin: auto;
}

/* HEADER */

header {
  height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #ddd;
  position: relative;
  z-index: 20;
  background: rgba(247,247,245,.92);
  backdrop-filter: blur(12px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -1px;
}

.logo-mark {
  width: 32px;
  height: 32px;
  background: #8247e5;
  clip-path: polygon(
    50% 0%,
    90% 22%,
    90% 78%,
    50% 100%,
    10% 78%,
    10% 22%
  );
  position: relative;
}

.logo-mark:after {
  content: "";
  position: absolute;
  width: 12px;
  height: 12px;
  background: #f7f7f5;
  left: 10px;
  top: 10px;
  transform: rotate(45deg);
}

nav {
  display: flex;
  gap: 30px;
  font-size: 14px;
  font-weight: 600;
}

nav a:hover {
  opacity: .55;
}

.header-btn {
  background: #111;
  color: white;
  padding: 13px 20px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
}

.menu {
  display: none;
  font-size: 25px;
}

/* HERO */

.hero {
  min-height: 650px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.hero:before {
  content: "";
  position: absolute;
  width: 650px;
  height: 650px;
  right: -180px;
  top: -120px;
  background: radial-gradient(
    circle,
    rgba(130,71,229,.30),
    rgba(130,71,229,.10) 35%,
    transparent 70%
  );
  filter: blur(15px);
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 900px;
  padding: 100px 0;
}

.small-label {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 25px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

.hero h1 {
  font-size: clamp(60px, 9vw, 135px);
  line-height: .88;
  letter-spacing: -7px;
  max-width: 1050px;
}

.hero h1 span {
  color: #8247e5;
}

.hero p {
  max-width: 680px;
  margin-top: 35px;
  font-size: 22px;
  line-height: 1.35;
  color: #555;
}

.buttons {
  display: flex;
  gap: 12px;
  margin-top: 35px;
  flex-wrap: wrap;
}

.btn {
  padding: 16px 24px;
  border-radius: 40px;
  font-size: 14px;
  font-weight: 700;
}

.btn-black {
  background: #111;
  color: white;
}

.btn-purple {
  background: #8247e5;
  color: white;
}

.btn-light {
  border: 1px solid #bbb;
}

/* TRUST */

.trusted {
  padding: 35px 0;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #ddd;
  color: #777;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

/* STATS */

.stats {
  padding: 90px 0;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 1px;
  background: #ccc;
  border: 1px solid #ccc;
}

.stat {
  background: #f7f7f5;
  padding: 35px 25px;
  min-height: 150px;
}

.stat-number {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -2px;
}
