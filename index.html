<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>POL</title>
  <meta name="description" content="POL — A token deployed on Polygon PoS.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #07070b;
      color: #fff;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: 20px 7%;
      background: rgba(7, 7, 11, 0.75);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    nav {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 30px;
      color: #aaa;
      font-size: 15px;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 140px 7% 80px;
      background:
        radial-gradient(circle at 50% 20%, #391067 0%, #171022 25%, #07070b 60%);
    }

    .hero-content {
      max-width: 1050px;
      margin: auto;
      width: 100%;
    }

    .tag {
      display: inline-block;
      padding: 8px 15px;
      margin-bottom: 25px;
      border: 1px solid #3d3d4b;
      border-radius: 50px;
      color: #bbb;
      font-size: 14px;
    }

    .hero h1 {
      font-size: clamp(70px, 13vw, 160px);
      line-height: 0.9;
      letter-spacing: -6px;
      margin-bottom: 30px;
    }

    .hero p {
      max-width: 680px;
      color: #a5a5ae;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      padding: 14px 23px;
      border-radius: 10px;
      background: #fff;
      color: #07070b;
      font-weight: bold;
    }

    .button.secondary {
      background: #15151d;
      color: #fff;
      border: 1px solid #30303b;
    }

    section {
      padding: 100px 7%;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .section-label {
      color: #888;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: clamp(38px, 6vw, 65px);
      margin-bottom: 45px;
      letter-spacing: -2px;
    }

    .
