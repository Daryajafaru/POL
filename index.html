<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLYGON</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#fff;
    line-height:1.6;
}

/* HEADER */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:76px;
    background:rgba(5,5,5,.95);
    border-bottom:1px solid #222;
    z-index:1000;
    backdrop-filter:blur(12px);
}

.nav{
    width:92%;
    max-width:1250px;
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:21px;
    font-weight:800;
    letter-spacing:.5px;
}

/* TWO HEXAGONS LOGO */

.logo-mark{
    width:48px;
    height:38px;
    position:relative;
    display:flex;
    align-items:center;
}

.hex{
    width:29px;
    height:34px;
    position:absolute;
    background:#8247e5;

    clip-path:polygon(
        25% 0%,
        75% 0%,
        100% 50%,
        75% 100%,
        25% 100%,
        0% 50%
    );
}

.hex::after{
    content:"";
    position:absolute;
    width:15px;
    height:20px;
    left:7px;
    top:7px;
    background:#050505;

    clip-path:polygon(
        25% 0%,
        75% 0%,
        100% 50%,
        75% 100%,
        25% 100%,
        0% 50%
    );
}

.hex-left{
    left:0;
    top:2px;
}

.hex-right{
    right:0;
    top:2px;
}

/* NAVIGATION */

nav{
    display:flex;
    gap:30px;
}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

nav a:hover{
    color:#fff;
}

/* HERO */

.hero{
    min-height:100vh;
    padding:120px 20px 80px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
    radial-gradient(
        circle at 50% 40%,
        rgba(130,71,229,.22),
        transparent 38%
    ),
    #050505;
}

.hero-content{
    max-width:900px;
}

.tag{
    color:#a66cff;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:25px;
}

h1{
    font-size:clamp(62px,12vw,150px);
    line-height:.9;
    letter-spacing:-6px;
    margin-bottom:30px;
}

.hero p{
